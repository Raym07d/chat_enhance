<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Chat Enhance</title>
    <link rel="stylesheet" href="popup.css">
  </head>
  <body>
    <main>
      <h1>Chat Enhance</h1>
      <button id="export-html" class="export-button" type="button">保存当前对话为 HTML</button>
      <button id="grant-image-access" class="access-button" type="button" hidden></button>
      <p class="export-hint">保存完整对话、公式和图片，供离线查看。</p>
      <label class="setting" for="compact-math">
        <span class="setting__copy">
          <strong>合并公式内部换行</strong>
          <span>提高不同 Markdown 编辑器的公式兼容性</span>
        </span>
        <span class="switch">
          <input id="compact-math" type="checkbox">
          <span class="switch__track" aria-hidden="true"></span>
        </span>
      </label>
      <p id="status" role="status" aria-live="polite"></p>
    </main>
    <script src="popup.js"></script>
  </body>
</html>
